name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=@platform/shared

      - name: Run unit tests
        run: npm test

      - name: Build all services
        run: |
          npm run build --workspace=@platform/auth-service
          npm run build --workspace=@platform/api-gateway
          npm run build --workspace=@platform/ai-service
          npm run build --workspace=@platform/execution-service
          npm run build --workspace=@platform/report-service
          npm run build --workspace=@platform/notification-service

      - name: Build frontend
        run: npm run build --workspace=@platform/frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

  integration-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          docker compose up -d mongodb redis rabbitmq
          sleep 15

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm install
          npm run build --workspace=@platform/shared
          npm run build --workspace=@platform/auth-service

      - name: Health check infrastructure
        run: |
          docker compose ps
          docker exec awtp-mongodb mongosh --eval "db.runCommand('ping')"
          docker exec awtp-redis redis-cli ping
